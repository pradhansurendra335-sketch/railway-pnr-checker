<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ t('app_title') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% include 'partials/nav.html' %}

<div class="page">
    <div class="card">
        <h1>{{ t('app_title') }}</h1>
        <p class="subtitle">{{ t('app_subtitle') }}</p>

        <form action="/result" method="POST" class="pnr-form">
            <input
                type="text"
                name="pnr"
                inputmode="numeric"
                pattern="[0-9]{10}"
                placeholder="{{ t('pnr_placeholder') }}"
                maxlength="10"
                required
                autofocus>

            <button type="submit">{{ t('check_pnr') }}</button>
        </form>
    </div>
</div>

{% include 'partials/chat_widget.html' %}

</body>
</html>
